# Neon migrate deploy, Phase 2 increment 13, updated 2026-11-05
# for the Neon direct connection.
# Manual only, through workflow_dispatch on GitHub. This workflow
# deploys the committed Prisma migrations to the real Neon database,
# and it runs ONLY when both repo secrets are present: DATABASE_URL
# with the Neon pooled connection string, and DIRECT_URL with the
# Neon direct, non-pooled connection string. Migrations must use
# the direct connection, never the pooler.
# The owner must add those secrets himself on GitHub, at Settings,
# Secrets and variables, Actions, New repository secret.
# He must NEVER paste either connection string in chat or in any file.
# No live Neon database is connected yet, because those secrets
# do not exist yet, so a run now fails plainly at the first step,
# with the instruction above, and does not fail silently.
# This workflow never runs on push, so a missing secret never turns
# an ordinary push red. It never writes a secret to a log, and it
# never runs a migration against any database except the one named
# by those secrets. Prisma migrate deploy applies only
# migrations already committed in prisma/migrations, it never
# creates a migration from a live database.
name: Neon migrate deploy

on:
  workflow_dispatch:

jobs:
  neon-migrate-deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Prisma CLI in a separate folder
        run: |
          mkdir -p prisma-ci
          cd prisma-ci
          npm init -y
          npm install prisma@6.14.0
      - name: Fail plainly when a database secret is absent
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set, so no migration was run and no database was touched."
            echo "Add it on GitHub at Settings, Secrets and variables, Actions, New repository secret, name DATABASE_URL, value the Neon pooled connection string."
            echo "Never paste the connection string in chat or in any file."
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "DIRECT_URL secret is not set, so no migration was run and no database was touched."
            echo "Add it on GitHub at Settings, Secrets and variables, Actions, New repository secret, name DIRECT_URL, value the Neon direct, non-pooled connection string."
            echo "Never paste the connection string in chat or in any file."
            exit 1
          fi
          echo "DATABASE_URL and DIRECT_URL secrets are present. Deploying committed migrations only, using the direct connection."
      - name: Validate schema
        run: |
          ./prisma-ci/node_modules/.bin/prisma validate --schema prisma/schema.prisma
      - name: Deploy committed migrations to Neon
        run: |
          ./prisma-ci/node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma
      - name: Confirm the migration status
        run: |
          ./prisma-ci/node_modules/.bin/prisma migrate status --schema prisma/schema.prisma
